name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  publish-brew:
    name: Update Homebrew Formula
    needs: release
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Homebrew tap
        run: |
          echo "Homebrew formula will be updated automatically by GoReleaser"
          echo "Make sure HOMEBREW_TAP_GITHUB_TOKEN is set in repository secrets"

  publish-winget:
    name: Publish to Winget
    needs: release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install wingetcreate
        run: |
          Write-Host "Installing wingetcreate..."
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit to Winget
        env:
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          Write-Host "Submitting version $version to Winget..."

          # Download URLs for all architectures
          $amd64Url = "https://github.com/Devolvio-B-V/cloudflare-dlp-forensic-copy-decoder/releases/download/v$version/cf-dlp-decode-windows-amd64.exe"
          $arm64Url = "https://github.com/Devolvio-B-V/cloudflare-dlp-forensic-copy-decoder/releases/download/v$version/cf-dlp-decode-windows-arm64.exe"

          # Try to update an existing Winget package first (works when the package
          # already exists in microsoft/winget-pkgs from a previous release).
          Write-Host "Attempting wingetcreate update..."
          $updateOutput = .\wingetcreate.exe update Devolvio-B-V.cf-dlp-decode `
            --version $version `
            --urls "$amd64Url|x64" "$arm64Url|arm64" `
            --token $env:WINGET_GITHUB_TOKEN `
            --submit 2>&1

          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Successfully updated Winget package!"
            Write-Host "A PR has been created in microsoft/winget-pkgs"
            Write-Host "Microsoft will review and merge (typically 1-3 business days)"
            exit 0
          }

          # Update failed – most likely the package does not exist in winget-pkgs yet.
          # Fall back to generating the manifests locally and submitting them directly.
          Write-Host "wingetcreate update output:"
          Write-Host $updateOutput
          Write-Host "Falling back to local manifest generation and submit..."

          # Download the Windows binaries and compute their SHA256 hashes so the
          # generated manifests are always accurate regardless of what is already
          # stored in the repository.
          Write-Host "Downloading binaries and computing SHA256 hashes..."
          Invoke-WebRequest -Uri $amd64Url -OutFile "amd64.exe"
          Invoke-WebRequest -Uri $arm64Url -OutFile "arm64.exe"
          $amd64Hash = (Get-FileHash "amd64.exe" -Algorithm SHA256).Hash.ToUpper()
          $arm64Hash = (Get-FileHash "arm64.exe" -Algorithm SHA256).Hash.ToUpper()
          Write-Host "AMD64 SHA256: $amd64Hash"
          Write-Host "ARM64 SHA256: $arm64Hash"

          # Create the manifest directory for this version.
          $manifestDir = "manifests\d\Devolvio-B-V\cf-dlp-decode\$version"
          New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null

          # Version manifest
          @(
            "# yaml-language-server: `$schema=https://aka.ms/winget-manifest.version.1.10.0.schema.json",
            "",
            "PackageIdentifier: Devolvio-B-V.cf-dlp-decode",
            "PackageVersion: $version",
            "DefaultLocale: en-US",
            "ManifestType: version",
            "ManifestVersion: 1.10.0"
          ) -join "`n" | Set-Content "$manifestDir\Devolvio-B-V.cf-dlp-decode.yaml" -Encoding UTF8

          # Installer manifest
          @(
            "# yaml-language-server: `$schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json",
            "",
            "PackageIdentifier: Devolvio-B-V.cf-dlp-decode",
            "PackageVersion: $version",
            "InstallerType: portable",
            "Commands:",
            "- cf-dlp-decode",
            "Installers:",
            "- Architecture: x64",
            "  InstallerUrl: $amd64Url",
            "  InstallerSha256: $amd64Hash",
            "- Architecture: arm64",
            "  InstallerUrl: $arm64Url",
            "  InstallerSha256: $arm64Hash",
            "ManifestType: installer",
            "ManifestVersion: 1.10.0"
          ) -join "`n" | Set-Content "$manifestDir\Devolvio-B-V.cf-dlp-decode.installer.yaml" -Encoding UTF8

          # Default locale manifest
          @(
            "# yaml-language-server: `$schema=https://aka.ms/winget-manifest.defaultLocale.1.10.0.schema.json",
            "",
            "PackageIdentifier: Devolvio-B-V.cf-dlp-decode",
            "PackageVersion: $version",
            "PackageLocale: en-US",
            "Publisher: SALT Cyber Security",
            "PublisherUrl: https://github.com/Devolvio-B-V",
            "PublisherSupportUrl: https://github.com/Devolvio-B-V/cloudflare-dlp-forensic-copy-decoder/issues/new/choose",
            "Author: Thomas van den Nieuwenhoff",
            "PackageName: Cloudflare DLP Forensic Copy Decoder",
            "PackageUrl: https://github.com/Devolvio-B-V/cloudflare-dlp-forensic-copy-decoder/tree/v$version",
            "License: As-is",
            "LicenseUrl: https://github.com/Devolvio-B-V/cloudflare-dlp-forensic-copy-decoder/blob/v$version/README.md#-license",
            "Copyright: Copyright (c) SALT Cyber Security B.V. All rights reserved.",
            "ShortDescription: A powerful command-line tool and interactive TUI for decoding Cloudflare DLP forensic copies from compressed log files.",
            "Moniker: cf-dlp-decode",
            "Tags:",
            "- go",
            "- golang",
            "- decoder",
            "- tui",
            "- cloudflare",
            "- payload",
            "- dlp",
            "- forensic",
            "- bubbletea",
            "- cloudflare-zero-trust",
            "ReleaseNotesUrl: https://github.com/Devolvio-B-V/cloudflare-dlp-forensic-copy-decoder/releases/tag/v$version",
            "InstallationNotes: https://github.com/Devolvio-B-V/cloudflare-dlp-forensic-copy-decoder/blob/v$version/README.md#-usage",
            "Documentations:",
            "- DocumentLabel: Readme",
            "  DocumentUrl: https://github.com/Devolvio-B-V/cloudflare-dlp-forensic-copy-decoder/blob/v$version/README.md",
            "ManifestType: defaultLocale",
            "ManifestVersion: 1.10.0"
          ) -join "`n" | Set-Content "$manifestDir\Devolvio-B-V.cf-dlp-decode.locale.en-US.yaml" -Encoding UTF8

          Write-Host "Manifest files created in $manifestDir"

          # Submit the generated manifests to microsoft/winget-pkgs.
          .\wingetcreate.exe submit $manifestDir `
            --token $env:WINGET_GITHUB_TOKEN

          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Successfully submitted to Winget!"
            Write-Host "A PR has been created in microsoft/winget-pkgs"
            Write-Host "Microsoft will review and merge (typically 1-3 business days)"
          } else {
            Write-Host "⚠️ Submission failed. You may need to submit manually."
            Write-Host "See: https://github.com/microsoft/winget-pkgs/blob/master/AUTHORING_MANIFESTS.md"
            exit 1
          }
